apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-app
  namespace: argocd          # Applications live in the argocd namespace
spec:
  project: default

  source:
    repoURL: git@github-omar-ait-bougnsa:omar-ait-bougnsa/simple-app.git
    targetRevision: main      # branch to watch
    path: .                   # folder containing your manifests (deployment.yaml, service.yaml, etc.)

  destination:
    server: https://kubernetes.default.svc   # in-cluster; the cluster ArgoCD itself runs on
    namespace: simple-app     # or default, if you skipped the Namespace step

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  # lets ArgoCD create the namespace if it doesn't exist
